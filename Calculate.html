<!DOCTYPE html>
<html>
<head>

  <title>Advanced Smart Report</title>

  <!-- html2canvas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>

    body{
      font-weight:bolder;
      padding:20px;
      background:#f5f7fa;
      font-family: Arial, Helvetica, sans-serif;
      color:#111827;
    }

    #report{
      width:550px;
      background:white;
      padding:20px;
      border:2px solid black;
      margin:auto;
      position:relative;
    }

    h1{
      text-align:center;
      color:#1e3a8a;
      margin-bottom:7px 0px 35px 0px;
      margin-left:-350px;
      font-size:22px;
    }

    h2{
      text-align:center;
      margin-top:0;
      color:#111827;
      font-size:30px;
    }

    table{
      border-collapse:collapse;
       width:50%; 
      margin-top:10px;
      background:white;
      color:#222;
    }

    th{
      background:#023648;
      color:white;
    }

    th,td{
      border:1px solid black;
      padding-bottom:10px;
      padding-top:10px;
      text-align:center;
      font-size:19.5px;
    }

    input,select{
      width:100px;
      padding:10px;
      font-size:16px;
      background:white;
      border:1px solid #7e7e7e;
      border-radius:5px;
    }

    button{
      margin-top:10px;
      padding:10px 15px;
      cursor:pointer;
      font-size:16px;
      background:#2c5dc6;
      color:white;
      border:none;
      border-radius:6px;
    }

    button:hover{
      background:#001346;
    }

    .btns{
      text-align:center;
    }

    .topRight{
      position:absolute;
      top:15px;
      right:20px;
      text-align:right;
      line-height:24px;
    }

    .dateBox{
      font-size:15px;
      font-weight:bold;
      color:#1f2937;
    }

    .customerBox{
      font-size:16px;
      color:#0f172a;
      font-weight:bold;
    }

    .pageNo{
      position:absolute;
      top:15px;
      left:20px;
      font-size:13px;
      color:#4b5563;
      font-weight:bold;
    }

    .topInputs{
      margin-bottom:15px;
      /* text-align:center; */
    }

    #rateSection{
      margin-top:15px;
    }

  </style>

</head>

<body>

<!-- INPUTS -->
<div class="topInputs">

  <label>Customer Name :</label>

  <input
  type="text"
  id="customerName"
  placeholder="Enter Name">

  &nbsp;&nbsp;

  <label>Select Report :</label>

  <select id="reportType">

    <option value="Monthly">
      Monthly
    </option>

    <option value="Half Monthly">
      Half Monthly
    </option>

    <option value="Weekly">
      Weekly
    </option>

  </select>

</div>

<!-- REPORT -->
<div id="report">

  <!-- Page Number -->
  <div class="pageNo" id="pageNumber">
    Page No. 1
  </div>

  <!-- Date Time -->
  <div class="topRight">

    <div class="dateBox" id="dateTime"></div>

    <div class="customerBox" id="showName"></div>

  </div>

  <!-- Creator Name -->
  <h1 id="mainHeading">
    Its by : Nikhil Kumar
  </h1>

  <!-- Report Title -->
  <h2 id="reportTitle">
    Monthly Report
  </h2>

  <!-- TABLE -->
  <table>

    <tr>
      <th>Date</th>
      <th>Chapati</th>
    </tr>

    <tbody id="tableBody"></tbody>

  </table>

  <!-- RATE -->
  <div id="rateSection">

    <br>

    <label>Rate :</label>

    <input
    type="number"
    id="multiplyNum"
    value="5">

  </div>

  <br><br>

  <!-- TOTALS -->
  <h3 id="total">
    Total Chapati : 0
  </h3>

  <h3 id="finalTotal">
    Total Rs. : 0
  </h3>

</div>

<br>

<div class="btns">

  <button onclick="calculateTotal()">
    Calculate
  </button>

  <button onclick="downloadImage()">
    Download Image
  </button>

</div>

<script>

  let tableBody =
  document.getElementById("tableBody");

  // Create 1 to 31 rows
  for(let i = 1; i <= 31; i++){

    tableBody.innerHTML += `
      <tr>

        <td>${i}</td>

        <td>

          <input
          type="number"
          class="dayInput"
          value=" 0">

        </td>

      </tr>
    `;
  }

  // Calculate total
  function calculateTotal(){

    let inputs =
    document.getElementsByClassName("dayInput");

    let total = 0;

    for(let i = 0; i < inputs.length; i++){

      let value =
      Number(inputs[i].value);

      if(value > 0){

        total += value;

      }

    }

    document.getElementById("total").innerHTML =
    "Total Chapati : " + total;

    let multiplyValue =
    Number(
      document.getElementById("multiplyNum").value
    );

    let final =
    total * multiplyValue;

    document.getElementById("finalTotal").innerHTML =
    "Total Rs. : " + final;

  }

  // Download Images
  async function downloadImage(){

    // Report title
    let type =
    document.getElementById("reportType").value;

    document.getElementById("reportTitle").innerHTML =
    type + " Report";

    // Date & Time
    let now = new Date();

    let options = {

      day:'2-digit',
      month:'long',
      year:'numeric',
      hour:'2-digit',
      minute:'2-digit'

    };

    let dateTime =
    now.toLocaleString(
      'en-IN',
      options
    );

    document.getElementById("dateTime").innerHTML =
    dateTime;

    // Customer Name
    let customer =
    document.getElementById("customerName").value;

    document.getElementById("showName").innerHTML =
    customer;

    let rows =
    document.querySelectorAll("#tableBody tr");

    let visibleRows = [];

    // Hide empty rows
    rows.forEach(function(row){

      let input =
      row.querySelector("input");

      let value =
      Number(input.value);

      if(value > 0){

        visibleRows.push(row);

      }

      else{

        row.style.display = "none";

      }

    });

    // 16 rows per image
    let chunkSize = 16;

    // Total images
    let totalImages =
    Math.ceil(
      visibleRows.length / chunkSize
    );

    // Generate images
    for(
      let start = 0;
      start < visibleRows.length;
      start += chunkSize
    ){

      // Hide all rows
      visibleRows.forEach(function(r){

        r.style.display = "none";

      });

      // Show current chunk
      let chunk =
      visibleRows.slice(
        start,
        start + chunkSize
      );

      chunk.forEach(function(r){

        r.style.display = "";

      });

      // Page Number
      document.getElementById("pageNumber").innerHTML =
      "Page No. " +
      (start / chunkSize + 1);

      // First image only
      if(start >= chunkSize){

        document.getElementById("mainHeading").style.display =
        "none";

      }

      else{

        document.getElementById("mainHeading").style.display =
        "block";

      }

      // Customer name always visible
      document.getElementById("showName").style.display =
      "block";

      // SINGLE IMAGE
      if(totalImages == 1){

        document.getElementById("rateSection").style.display =
        "block";

        document.getElementById("total").style.display =
        "block";

        document.getElementById("finalTotal").style.display =
        "block";

      }

      // MULTIPLE IMAGES
      else{

        // LAST IMAGE
        if(start + chunkSize >= visibleRows.length){

          document.getElementById("rateSection").style.display =
          "block";

          document.getElementById("total").style.display =
          "block";

          document.getElementById("finalTotal").style.display =
          "block";

        }

        // FIRST IMAGE
        else{

          document.getElementById("rateSection").style.display =
          "none";

          document.getElementById("total").style.display =
          "none";

          document.getElementById("finalTotal").style.display =
          "none";

        }

      }

      let report =
      document.getElementById("report");

      let canvas =
      await html2canvas(report, {

        scale:3

      });

      let a =
      document.createElement("a");

      a.href =
      canvas.toDataURL("image/png");

      a.download =
      "report_part_" +
      (start / chunkSize + 1) +
      ".png";

      document.body.appendChild(a);

      setTimeout(() => {

        a.click();

      }, 500);

      // Delay for mobile
      await new Promise(resolve =>
        setTimeout(resolve, 1500)
      );

      document.body.removeChild(a);

    }

    // Reset UI
    rows.forEach(function(row){

      row.style.display = "";

    });

    document.getElementById("mainHeading").style.display =
    "block";

    document.getElementById("rateSection").style.display =
    "block";

    document.getElementById("total").style.display =
    "block";

    document.getElementById("finalTotal").style.display =
    "block";

  }

</script>

</body>
</html>
